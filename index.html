<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessibilidade</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <header>
        <h1>Site Acessível</h1>

    <p>
        Esta página possui ferramentas para facilitar a navegação de diferentes usúarios.
    </p>
    </header>

    <main>

    <section class="controles" aria-label="Controles de Acessibilidade">
        <button onclick="aumentarTexto()">
            A+ Aumentar texto
        </button>

        <button onclick="diminuirTexto()">
            A- Diminuar texto
        </button>

        <button onclick="altoContraste()">
            🌓 Alto contraste
        </button>

        <button onclick="lerPagina()">
            🔊 Ler página
        </button>

        <button onclick="pararLeitura()">
            ⏹️ Parar leitura
        </button>

    </section> 
</main>
    <section>

<section  id="conteudo">
            <h2>Bem-vindo!</h2>

        <p>
            A acessibilidade de um site permite que todas as pessoas possam 
            utilizá-lo com facilidade. Recursos como aumentar a fonte e ler o 
            conteúdo em voz alta tornam o site mais acessível.
        </p>

    </section>

 <script src="./js/script.js"></script>
</head>

</body>
</html>
